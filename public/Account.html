<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账户中心 · Nexabox</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 工业风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1d23;
            font-family: 'Segoe UI', 'Roboto', 'Consolas', monospace;
            color: #e0e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #23272e;
            border: 1px solid #3a4050;
            border-radius: 0;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .navbar .title {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .navbar .title span {
            color: #4a8bf5;
            font-weight: 600;
        }
        .navbar .actions {
            display: flex;
            gap: 12px;
        }
        .navbar .actions button {
            background: transparent;
            border: 1px solid #3a4050;
            color: #b0c0d6;
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            border-radius: 0;
        }
        .navbar .actions button:hover {
            background: #4a8bf5;
            border-color: #4a8bf5;
            color: #14181e;
        }

        /* ===== 卡片容器 ===== */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== 卡片通用样式 ===== */
        .card {
            background: #23272e;
            border: 1px solid #3a4050;
            border-radius: 0;
            padding: 20px 24px;
        }
        .card .card-title {
            font-size: 16px;
            font-weight: 500;
            color: #4a8bf5;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2f3644;
            padding-bottom: 8px;
            text-transform: uppercase;
            font-family: 'Consolas', monospace;
        }

        /* ===== 用户信息卡片 ===== */
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .user-info .avatar {
            width: 72px;
            height: 72px;
            border: 2px solid #4a8bf5;
            background: #14181e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 600;
            color: #4a8bf5;
            flex-shrink: 0;
        }
        .user-info .details {
            flex: 1;
        }
        .user-info .details .name {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 4px;
        }
        .user-info .details .perms {
            font-size: 14px;
            color: #8a9bb5;
        }
        .user-info .details .lastlogin {
            font-size: 13px;
            color: #4a5a6e;
            margin-top: 4px;
        }

        /* ===== 设置区域：头像 & 密码 并排 ===== */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field-group label {
            font-size: 13px;
            color: #b0c0d6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Consolas', monospace;
        }
        .field-group input {
            padding: 8px 10px;
            background: #14181e;
            border: 1px solid #3a4050;
            border-radius: 0;
            color: #e0e8f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.15s;
        }
        .field-group input:focus {
            border-color: #4a8bf5;
            box-shadow: inset 0 0 0 1px #4a8bf5;
        }
        .btn {
            background: #2f3644;
            border: 1px solid #4a8bf5;
            color: #4a8bf5;
            padding: 8px 18px;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            align-self: flex-start;
        }
        .btn:hover {
            background: #4a8bf5;
            color: #14181e;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 消息卡片 ===== */
        .msg-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .msg-row .field-group {
            flex: 1;
            min-width: 120px;
        }
        .msg-row .field-group input,
        .msg-row .field-group textarea {
            width: 100%;
        }
        .msg-row .field-group textarea {
            resize: vertical;
            min-height: 60px;
            background: #14181e;
            border: 1px solid #3a4050;
            color: #e0e8f0;
            padding: 8px 10px;
            font-family: inherit;
            outline: none;
            border-radius: 0;
        }
        .msg-row .field-group textarea:focus {
            border-color: #4a8bf5;
        }

        .inbox-list {
            margin-top: 12px;
            max-height: 240px;
            overflow-y: auto;
        }
        .inbox-list .msg-item {
            padding: 8px 0;
            border-bottom: 1px solid #2f3644;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .inbox-list .msg-item .meta {
            font-size: 13px;
            color: #8a9bb5;
        }
        .inbox-list .msg-item .content {
            flex: 1;
            word-break: break-all;
        }
        .inbox-list .empty {
            color: #4a5a6e;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== Toast 消息 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 24px;
            font-size: 14px;
            border: 1px solid #4a8bf5;
            border-radius: 0;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            border-color: #2ecc71;
        }
        .toast.error {
            border-color: #e74c3c;
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1d23;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a8bf5;
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <nav class="navbar">
        <div class="title"><span>Nexa</span>box · 账户中心</div>
        <div class="actions">
            <button onclick="window.location.reload()" title="刷新"><i class="fas fa-sync-alt"></i></button>
            <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出</button>
        </div>
    </nav>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- 用户信息 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-user"></i> 个人信息</div>
            <div class="user-info">
                <div class="avatar" id="avatarDisplay">U</div>
                <div class="details">
                    <div class="name" id="usernameDisplay">加载中...</div>
                    <div class="perms" id="permsDisplay">权限：</div>
                    <div class="lastlogin" id="lastLoginDisplay">上次登录：</div>
                </div>
            </div>
        </div>

        <!-- 设置 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-cog"></i> 账户设置</div>
            <div class="settings-grid">
                <!-- 修改头像 -->
                <div class="field-group">
                    <label><i class="fas fa-image"></i> 头像 URL</label>
                    <input type="text" id="avatarInput" placeholder="输入图片链接" />
                    <button class="btn" id="updateAvatarBtn">更新头像</button>
                </div>
                <!-- 修改密码 -->
                <div class="field-group">
                    <label><i class="fas fa-lock"></i> 新密码</label>
                    <input type="password" id="passwordInput" placeholder="输入新密码" />
                    <button class="btn" id="updatePasswordBtn">修改密码</button>
                </div>
                <!-- 在 Account.html 的设置区域添加 -->
                <div class="field-group">
                    <label><i class="fas fa-palette"></i> 背景颜色</label>
                    <input type="color" id="bgColorPicker" value="#1e1e2f" />
                </div>
                <div class="field-group">
                    <label><i class="fas fa-image"></i> 背景图片 URL</label>
                    <input type="text" id="bgImageInput" placeholder="输入图片链接（留空则使用颜色）" />
                    <button class="btn" id="saveBgConfigBtn">保存背景设置</button>
                </div>
                <div class="field-group">
                    <label><i class="fas fa-glass"></i> 主菜单透明度</label>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <input type="range" id="opacitySlider" 
                               min="0.1" max="1.0" step="0.05" 
                               value="1.0" 
                               style="flex:1; accent-color: #4a8bf5;" />
                        <span id="opacityDisplay" style="min-width:40px; font-family:'Consolas',monospace; color:#8a9bb5;">1.00</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-undo-alt"></i> 个性化设置</div>
                <p style="color: #8a9bb5; font-size: 14px; margin-bottom: 12px;">
                    重置所有个性化设置（背景颜色、背景图片、透明度等）到系统默认值。
                </p>
                <button class="btn" id="resetConfigBtn" style="border-color: #e74c3c; color: #e74c3c;">
                    <i class="fas fa-trash-alt"></i> 重置个性化设置
                </button>
        </div>

        <!-- 消息 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-envelope"></i> 内部消息</div>
            <div class="msg-row">
                <div class="field-group">
                    <label>接收人</label>
                    <input type="text" id="msgTo" placeholder="用户名" />
                </div>
                <div class="field-group">
                    <label>内容</label>
                    <textarea id="msgContent" placeholder="输入消息内容..."></textarea>
                </div>
                <div style="display:flex; align-items:flex-end; gap:8px; flex-wrap:wrap;">
                    <button class="btn" id="sendMsgBtn">发送</button>
                    <button class="btn" id="refreshInboxBtn" style="border-color:#6a7a8a; color:#8a9bb5;">刷新收件箱</button>
                </div>
            </div>
            <div class="inbox-list" id="inboxList">
                <div class="empty">加载消息中...</div>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 工具函数 & Token 获取
            // ============================================================
            function getToken() {
                return localStorage.getItem('nexabox_token') ||
                       localStorage.getItem('studio_auth_token') ||
                       sessionStorage.getItem('nexabox_token') ||
                       sessionStorage.getItem('studio_auth_token') ||
                       '';
            }

            function showToast(msg, type) {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.className = 'toast';
                if (type) el.classList.add(type);
                el.classList.add('show');
                clearTimeout(el._timer);
                el._timer = setTimeout(() => el.classList.remove('show'), 3500);
            }

            // ============================================================
            //  2. API 请求封装
            // ============================================================
            async function apiRequest(endpoint, options = {}) {
                const token = getToken();
                const headers = {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    ...options.headers,
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                const url = endpoint.startsWith('http') ? endpoint : `https://accounts.nexabox.de/api${endpoint}`;
                const response = await fetch(url, {
                    ...options,
                    headers,
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.message) errMsg = errData.message;
                    } catch (_) {}
                    throw new Error(errMsg);
                }
                const text = await response.text();
                return text ? JSON.parse(text) : null;
            }

            // ============================================================
            //  3. 登录状态 & 用户信息加载
            // ============================================================
            async function loadUserInfo() {
                try {
                    const data = await apiRequest('/me');
                    // 更新界面
                    document.getElementById('usernameDisplay').textContent = data.username || '未知用户';
                    const perms = data.permissions || [];
                    document.getElementById('permsDisplay').textContent = '权限：' + (perms.length ? perms.join(', ') : '无');
                    if (data.lastLogin) {
                        const date = new Date(data.lastLogin);
                        document.getElementById('lastLoginDisplay').textContent = '上次登录：' + date.toLocaleString();
                    } else {
                        document.getElementById('lastLoginDisplay').textContent = '上次登录：首次登录';
                    }
                    // 头像
                    const avatarEl = document.getElementById('avatarDisplay');
                    if (data.avatar) {
                        avatarEl.innerHTML = `<img src="${data.avatar}" style="width:72px; height:72px; object-fit:cover;" alt="avatar" />`;
                    } else {
                        const initial = (data.username || 'U').charAt(0).toUpperCase();
                        avatarEl.textContent = initial;
                        avatarEl.style.background = '#14181e';
                        avatarEl.style.color = '#4a8bf5';
                        avatarEl.style.fontSize = '36px';
                        avatarEl.style.display = 'flex';
                        avatarEl.style.alignItems = 'center';
                        avatarEl.style.justifyContent = 'center';
                    }
                    // 预填头像输入框
                    if (data.avatar) {
                        document.getElementById('avatarInput').value = data.avatar;
                    }
                    loadUserConfigForAccount();
                } catch (e) {
                    showToast('加载用户信息失败：' + e.message, 'error');
                    // 如果未登录，跳转登录
                    if (e.message.includes('401') || e.message.includes('403')) {
                        window.location.href = 'Login.html?redirect=' + encodeURIComponent(window.location.href);
                    }
                }
            }
            async function loadUserConfigForAccount() {
                const token = getToken();
                if (!token) return;
            try {
                    const response = await fetch('/api/user-config', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!response.ok) return;
                    const config = await response.json();
                    if (config.mainMenuOpacity !== undefined) {
                        document.getElementById('opacitySlider').value = config.mainMenuOpacity;
                        document.getElementById('opacityDisplay').textContent = config.mainMenuOpacity.toFixed(2);
                    }
                } catch (e) {
                    console.warn('加载配置失败', e);
                }
            }

            // ============================================================
            //  4. 头像更新
            // ============================================================
            async function updateAvatar() {
                const avatarUrl = document.getElementById('avatarInput').value.trim();
                if (!avatarUrl) {
                    showToast('请输入头像 URL', 'error');
                    return;
                }
                try {
                    await apiRequest('/update-avatar', {
                        method: 'POST',
                        body: JSON.stringify({ avatar: avatarUrl }),
                    });
                    showToast('头像更新成功', 'success');
                    loadUserInfo(); // 刷新
                } catch (e) {
                    showToast('头像更新失败：' + e.message, 'error');
                }
            }
            document.getElementById('updateAvatarBtn').addEventListener('click', updateAvatar);

            // ============================================================
            //  5. 密码修改
            // ============================================================
            async function updatePassword() {
                const newPwd = document.getElementById('passwordInput').value.trim();
                if (!newPwd) {
                    showToast('请输入新密码', 'error');
                    return;
                }
                try {
                    await apiRequest('/change-password', {
                        method: 'POST',
                        body: JSON.stringify({ newPassword: newPwd }),
                    });
                    showToast('密码修改成功', 'success');
                    document.getElementById('passwordInput').value = '';
                } catch (e) {
                    showToast('密码修改失败：' + e.message, 'error');
                }
            }
            document.getElementById('updatePasswordBtn').addEventListener('click', updatePassword);


            //5.1 个性化
            document.getElementById('saveBgConfigBtn').addEventListener('click', async () => {
                const backgroundColor = document.getElementById('bgColorPicker').value;
                const backgroundImage = document.getElementById('bgImageInput').value.trim();
                const opacity = parseFloat(document.getElementById('opacitySlider').value);
                const config = { 
                    backgroundColor, 
                    backgroundImage,
                    mainMenuOpacity: opacity
                };
                try {
                    const res = await apiRequest('/user-config', {
                        method: 'POST',
                        body: JSON.stringify(config)
                    });
                    if (res.success) {
                        showToast('配置已保存', 'success');
                        // 立即预览（需要通知主菜单刷新）
                    } else {
                        showToast('保存失败', 'error');
                    }
                } catch (e) {
                    showToast('保存失败：' + e.message, 'error');
                }
            });
            document.getElementById('opacitySlider').addEventListener('input', function() {
                document.getElementById('opacityDisplay').textContent = this.value;
            });
            //5.1.1 重制
            document.getElementById('resetConfigBtn').addEventListener('click', async () => {
                if (!confirm('确定要重置所有个性化设置吗？这将恢复默认背景和布局。')) return;
                    try {
                        const token = getToken();
                        const res = await fetch('/api/user-config', {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            showToast('个性化设置已重置为默认值', 'success');
                            // 刷新页面以应用默认配置
                            setTimeout(() => window.location.reload(), 1000);
                        } else {
                            const err = await res.json();
                            showToast('重置失败：' + (err.error || '未知错误'), 'error');
                        }
                    } catch (e) {
                        showToast('重置失败：' + e.message, 'error');
                    }
            });
            // ============================================================
            //  6. 发送消息
            // ============================================================
            async function sendMessage() {
                const toUser = document.getElementById('msgTo').value.trim();
                const content = document.getElementById('msgContent').value.trim();
                if (!toUser || !content) {
                    showToast('接收人和内容不能为空', 'error');
                    return;
                }
                try {
                    await apiRequest('/messages', {
                        method: 'POST',
                        body: JSON.stringify({ toUser, content }),
                    });
                    showToast('消息已发送', 'success');
                    document.getElementById('msgContent').value = '';
                    loadMessages(); // 刷新收件箱
                } catch (e) {
                    showToast('发送失败：' + e.message, 'error');
                }
            }
            document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);

            // ============================================================
            //  7. 加载收件箱
            // ============================================================
            async function loadMessages() {
                const list = document.getElementById('inboxList');
                list.innerHTML = '<div class="empty">加载中...</div>';
                try {
                    const data = await apiRequest('/messages');
                    if (!Array.isArray(data) || data.length === 0) {
                        list.innerHTML = '<div class="empty">暂无消息</div>';
                        return;
                    }
                    // 按时间倒序显示最新的在前
                    const sorted = data.sort((a, b) => new Date(b.time) - new Date(a.time));
                    list.innerHTML = sorted.map(msg => `
                        <div class="msg-item">
                            <div class="content">
                                <strong>${msg.from}</strong>：${msg.content}
                            </div>
                            <div class="meta">${new Date(msg.time).toLocaleString()}</div>
                        </div>
                    `).join('');
                } catch (e) {
                    list.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
                }
            }
            document.getElementById('refreshInboxBtn').addEventListener('click', loadMessages);

            // ============================================================
            //  8. 退出登录
            // ============================================================
            function logout() {
                localStorage.removeItem('nexabox_token');
                localStorage.removeItem('nexabox_username');
                localStorage.removeItem('studio_auth_token');
                localStorage.removeItem('studio_username');
                localStorage.removeItem('studio_perms');
                sessionStorage.removeItem('nexabox_token');
                sessionStorage.removeItem('studio_auth_token');
                window.location.href = 'Login.html?redirect=' + encodeURIComponent(window.location.href);
            }

            // ============================================================
            //  9. 初始化
            // ============================================================
            // 检查 token
            if (!getToken()) {
                // 跳转登录
                window.location.href = 'Login.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }

            loadUserInfo();
            loadMessages();

            // 支持回车发送消息
            document.getElementById('msgContent').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            console.log('✅ Account 页面已加载');
        })();
    </script>
</body>
</html>
