<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · Nexabox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* 样式不变（略） */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#1a1d23; font-family:'Segoe UI','Roboto','Consolas',monospace; height:100vh; display:flex; align-items:center; justify-content:center; margin:0; background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.01) 0px,rgba(255,255,255,0.01) 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px); }
        .login-container { background:#23272e; border:2px solid #3a4050; border-radius:0; padding:44px 40px 36px 40px; width:400px; max-width:92%; box-shadow:8px 8px 0 rgba(0,0,0,0.5); position:relative; }
        .login-container::before { content:''; position:absolute; top:-2px; left:20px; right:20px; height:4px; background:#4a8bf5; }
        .login-logo { font-size:36px; font-weight:300; color:#e8edf3; letter-spacing:2px; text-transform:uppercase; font-family:'Consolas','Courier New',monospace; margin-bottom:2px; }
        .login-logo span { font-weight:700; color:#4a8bf5; }
        .login-sub { color:#8a9bb5; font-size:14px; font-weight:400; letter-spacing:1px; margin-bottom:30px; border-bottom:1px solid #2f3644; padding-bottom:14px; font-family:'Segoe UI',sans-serif; }
        .login-sub i { margin-right:8px; opacity:0.6; }
        .login-form { display:flex; flex-direction:column; gap:14px; text-align:left; }
        .login-form .field { display:flex; flex-direction:column; gap:4px; }
        .login-form label { color:#b0c0d6; font-size:13px; font-weight:500; letter-spacing:0.5px; text-transform:uppercase; font-family:'Consolas',monospace; }
        .login-form label i { margin-right:6px; color:#4a8bf5; width:18px; }
        .login-form input { width:100%; padding:12px 14px; background:#14181e; border:1.5px solid #3a4050; border-radius:0; color:#e0e8f0; font-size:15px; font-family:'Consolas','Courier New',monospace; transition:all 0.15s ease; outline:none; }
        .login-form input::placeholder { color:#4a5568; font-weight:300; font-family:'Segoe UI',sans-serif; }
        .login-form input:focus { border-color:#4a8bf5; background:#1a2029; box-shadow:inset 0 0 0 1px #4a8bf5; }
        .login-btn { margin-top:10px; padding:14px; background:#2f3644; border:2px solid #4a8bf5; border-radius:0; color:#4a8bf5; font-size:16px; font-weight:700; font-family:'Consolas',monospace; text-transform:uppercase; letter-spacing:1.5px; cursor:pointer; transition:all 0.2s ease; position:relative; }
        .login-btn:hover { background:#4a8bf5; color:#14181e; box-shadow:4px 4px 0 rgba(74,139,245,0.3); }
        .login-btn:active { transform:scale(0.97); }
        .login-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; box-shadow:none !important; background:#2f3644; color:#4a8bf5; }
        .login-error { color:#ff6b6b; font-size:13px; min-height:22px; margin-top:2px; text-align:center; font-weight:400; font-family:'Consolas',monospace; background:rgba(255,107,107,0.08); padding:4px 0; border-left:3px solid #ff6b6b; }
        .login-spinner { display:inline-block; width:18px; height:18px; border:2px solid #4a8bf5; border-top-color:transparent; border-radius:0; animation:spinRect 0.9s linear infinite; vertical-align:middle; margin-right:8px; }
        @keyframes spinRect { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
        .login-footer { margin-top:28px; padding-top:18px; border-top:1px solid #2f3644; color:#4a5a6e; font-size:12px; font-weight:300; letter-spacing:0.5px; font-family:'Consolas',monospace; display:flex; justify-content:space-between; }
        .login-footer .status { color:#4a8bf5; }
        .login-footer .status i { margin-right:4px; }
        @media (max-width:440px){ .login-container{ padding:28px 18px 24px 18px; } .login-logo{ font-size:28px; } .login-btn{ font-size:14px; padding:12px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo"><span>Nexa</span>box</div>
        <div class="login-sub"><i class="fas fa-terminal"></i> 安全登录</div>
        <form class="login-form" id="loginForm" autocomplete="off">
            <div class="field">
                <label for="username"><i class="fas fa-user"></i> 用户名</label>
                <input type="text" id="username" placeholder="输入用户名" autocomplete="username" required />
            </div>
            <div class="field">
                <label for="password"><i class="fas fa-lock"></i> 密码</label>
                <input type="password" id="password" placeholder="输入密码" autocomplete="current-password" required />
            </div>
            <div class="login-error" id="loginError"></div>
            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> 登录
            </button>
        </form>
        <div class="login-footer">
            <span>Nexabox</span>
            <span class="status"><i class="fas fa-shield-alt"></i> 加密连接</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. URL 参数解析
            // ============================================================
            const urlParams = new URLSearchParams(window.location.search);
            const targetApp = urlParams.get('app');
            const redirectUrl = urlParams.get('redirect');
            console.log('[Login] URL参数:', { targetApp, redirectUrl });

            // ============================================================
            //  2. DOM 引用
            // ============================================================
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            // ============================================================
            //  3. Token 工具函数
            // ============================================================
            function getToken() {
                const t = localStorage.getItem('nexabox_token') ||
                          localStorage.getItem('studio_auth_token') ||
                          sessionStorage.getItem('nexabox_token') ||
                          sessionStorage.getItem('studio_auth_token') ||
                          '';
                console.log('[Login] getToken() 返回:', t ? t.substring(0,8)+'...' : '(空)');
                return t;
            }

            function setToken(token, username, permissions) {
                console.log('[Login] setToken 保存:', { token: token.substring(0,8)+'...', username, permissions });
                localStorage.setItem('nexabox_token', token);
                localStorage.setItem('nexabox_username', username);
                localStorage.setItem('studio_auth_token', token);
                localStorage.setItem('studio_username', username);
                localStorage.setItem('studio_perms', JSON.stringify(permissions || []));
            }

            function clearToken() {
                console.log('[Login] clearToken 清除所有 token');
                localStorage.removeItem('nexabox_token');
                localStorage.removeItem('nexabox_username');
                localStorage.removeItem('studio_auth_token');
                localStorage.removeItem('studio_username');
                localStorage.removeItem('studio_perms');
                sessionStorage.removeItem('nexabox_token');
                sessionStorage.removeItem('studio_auth_token');
            }

            // ============================================================
            //  4. 登录后跳转处理（统一入口）
            // ============================================================
            function handlePostLogin(token, username, permissions, isInitial) {
                console.log('[Login] handlePostLogin 被调用', {
                    token: token.substring(0,8)+'...',
                    username,
                    permissions,
                    isInitial,
                    targetApp,
                    redirectUrl,
                    isIframe: window.parent !== window
                });

                setToken(token, username, permissions);
                localStorage.setItem('pan_token', token);
                if (window.parent !== window) {
                    console.log('[Login] 分支: iframe 模式，postMessage 通知父页面');
                    window.parent.postMessage({
                        type: 'NEXABOX_LOGIN_SUCCESS',
                        payload: { token, username, permissions, isInitial }
                    }, '*');
                    loginBtn.innerHTML = '✅ 登录成功，正在进入...';
                    loginBtn.style.borderColor = '#2ecc71';
                    loginBtn.style.color = '#2ecc71';
                    loginBtn.disabled = true;
                    return;
                }

                if (isInitial) {
                    console.log('[Login] 分支: 首次登录，跳转 Account.html 改密码');
                    let target = 'Account.html?change_pwd=1';
                    if (targetApp && redirectUrl) {
                        target += `&app=${encodeURIComponent(targetApp)}&redirect=${encodeURIComponent(redirectUrl)}`;
                        console.log('[Login] 首次登录携带 SSO 参数:', target);
                    }
                    window.location.href = target;
                    return;
                }

                if (targetApp && redirectUrl) {
                    console.log('[Login] 分支: SSO 回调模式');
                    const perms = permissions || [];
                    const hasAll = perms.includes('all');
                    const hasApp = perms.includes(targetApp);
                    console.log('[Login] SSO 权限检查:', { perms, hasAll, hasApp, targetApp });
                    if (hasAll || hasApp) {
                        const url = new URL(redirectUrl, window.location.origin);
                        url.searchParams.set('token', token);
                        console.log('[Login] SSO 权限通过，跳转:', url.toString());
                        window.location.href = url.toString();
                    } else {
                        errorEl.textContent = '✗ 您没有应用 ' + targetApp + ' 的访问权限！';
                        console.warn('[Login] SSO 权限不足，显示错误');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> 登录';
                        loginBtn.style.borderColor = '#4a8bf5';
                        loginBtn.style.color = '#4a8bf5';
                    }
                    return;
                }

                console.log('[Login] 分支: 工作台独立窗口，跳转 MainMenu.html');
                window.location.href = 'MainMenu.html';
            }

            // ============================================================
            //  5. 页面加载时验证已有 Token（SSO 回调模式）
            // ============================================================
            async function verifyExistingToken() {
                const token = getToken();
                if (!token) {
                    console.log('[Login] verifyExistingToken: 无 token');
                    return false;
                }

                console.log('[Login] verifyExistingToken: 验证 token...');
                try {
                    const res = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, app: targetApp })
                    });
                    const data = await res.json();
                    console.log('[Login] verifyExistingToken 响应:', data);
                    if (data.valid) {
                        const perms = data.permissions || [];
                        console.log('[Login] Token 有效，直接跳转');
                        handlePostLogin(token, data.username, perms, false);
                        return true;
                    } else {
                        console.log('[Login] Token 无效，清除');
                        clearToken();
                        return false;
                    }
                } catch (e) {
                    console.warn('[Login] Token 验证失败:', e);
                    return false;
                }
            }

            // ============================================================
            //  6. 登录逻辑
            // ============================================================
            async function doLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                console.log('[Login] doLogin 被调用', { username, password: password ? '***' : '' });

                if (!username || !password) {
                    errorEl.textContent = '⚠ 请输入用户名和密码';
                    console.warn('[Login] 用户名或密码为空');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="login-spinner"></span> 验证中...';
                errorEl.textContent = '';

                try {
                    console.log('[Login] 发起登录请求...', { username, app: targetApp });
                    const response = await fetch('https://accounts.nexabox.de/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, app: targetApp })
                    });

                    const data = await response.json();
                    console.log('[Login] 登录响应:', data);

                    if (!response.ok) {
                        throw new Error(data.message || `请求失败 (${response.status})`);
                    }

                    if (data.success === true && data.token) {
                        console.log('[Login] 登录成功，调用 handlePostLogin');
                        handlePostLogin(
                            data.token,
                            data.username || username,
                            data.permissions || [],
                            data.isInitial || false
                        );
                    } else {
                        throw new Error(data.message || '登录失败，请检查凭证');
                    }

                } catch (err) {
                    console.error('[Login] 登录异常:', err);
                    errorEl.textContent = '✗ ' + (err.message || '网络错误，请稍后重试');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> 登录';
                    loginBtn.style.borderColor = '#4a8bf5';
                    loginBtn.style.color = '#4a8bf5';
                }
            }

            // ============================================================
            //  7. 事件绑定 & 初始化
            // ============================================================

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                doLogin();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doLogin();
                }
            });

            const presetUser = urlParams.get('username');
            if (presetUser) {
                usernameInput.value = presetUser;
                console.log('[Login] 预设用户名:', presetUser);
            }

            if (usernameInput.value) {
                passwordInput.focus();
            } else {
                usernameInput.focus();
            }

            (function init() {
                console.log('[Login] 初始化开始');
                if (targetApp && redirectUrl && getToken()) {
                    console.log('[Login] 检测到 SSO 模式且有 token，尝试自动验证');
                    verifyExistingToken();
                } else {
                    console.log('[Login] 非 SSO 模式或无 token，等待用户输入');
                }
                console.log('[Nexabox Login] 已就绪');
            })();

        })();
    </script>
</body>
</html>
