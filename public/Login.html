<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · Nexabox</title>
    <!-- Font Awesome 用于工业图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 工业风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1d23;
            font-family: 'Segoe UI', 'Roboto', 'Consolas', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-image: repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.01) 0px,
                    rgba(255, 255, 255, 0.01) 2px,
                    rgba(0, 0, 0, 0.02) 2px,
                    rgba(0, 0, 0, 0.02) 4px);
        }

        /* ===== 登录卡片 — 直角，硬边框 ===== */
        .login-container {
            background: #23272e;
            border: 2px solid #3a4050;
            border-radius: 0;
            padding: 44px 40px 36px 40px;
            width: 400px;
            max-width: 92%;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.15s ease;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: #4a8bf5;
        }

        .login-logo {
            font-size: 36px;
            font-weight: 300;
            color: #e8edf3;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Consolas', 'Courier New', monospace;
            margin-bottom: 2px;
        }

        .login-logo span {
            font-weight: 700;
            color: #4a8bf5;
        }

        .login-sub {
            color: #8a9bb5;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border-bottom: 1px solid #2f3644;
            padding-bottom: 14px;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-sub i {
            margin-right: 8px;
            opacity: 0.6;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .login-form .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .login-form label {
            color: #b0c0d6;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: 'Consolas', monospace;
        }

        .login-form label i {
            margin-right: 6px;
            color: #4a8bf5;
            width: 18px;
        }

        .login-form input {
            width: 100%;
            padding: 12px 14px;
            background: #14181e;
            border: 1.5px solid #3a4050;
            border-radius: 0;
            color: #e0e8f0;
            font-size: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            transition: all 0.15s ease;
            outline: none;
        }

        .login-form input::placeholder {
            color: #4a5568;
            font-weight: 300;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-form input:focus {
            border-color: #4a8bf5;
            background: #1a2029;
            box-shadow: inset 0 0 0 1px #4a8bf5;
        }

        .login-btn {
            margin-top: 10px;
            padding: 14px;
            background: #2f3644;
            border: 2px solid #4a8bf5;
            border-radius: 0;
            color: #4a8bf5;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Consolas', monospace;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .login-btn:hover {
            background: #4a8bf5;
            color: #14181e;
            box-shadow: 4px 4px 0 rgba(74, 139, 245, 0.3);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            background: #2f3644;
            color: #4a8bf5;
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            min-height: 22px;
            margin-top: 2px;
            text-align: center;
            font-weight: 400;
            font-family: 'Consolas', monospace;
            background: rgba(255, 107, 107, 0.08);
            padding: 4px 0;
            border-left: 3px solid #ff6b6b;
        }

        .login-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #4a8bf5;
            border-top-color: transparent;
            border-radius: 0;
            animation: spinRect 0.9s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spinRect {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid #2f3644;
            color: #4a5a6e;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
            font-family: 'Consolas', monospace;
            display: flex;
            justify-content: space-between;
        }

        .login-footer .status {
            color: #4a8bf5;
        }

        .login-footer .status i {
            margin-right: 4px;
        }

        @media (max-width: 440px) {
            .login-container {
                padding: 28px 18px 24px 18px;
            }
            .login-logo {
                font-size: 28px;
            }
            .login-btn {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">
            <span>Nexa</span>box
        </div>
        <div class="login-sub">
            <i class="fas fa-terminal"></i> 安全登录
        </div>

        <form class="login-form" id="loginForm" autocomplete="off">
            <div class="field">
                <label for="username"><i class="fas fa-user"></i> 用户名</label>
                <input type="text" id="username" placeholder="输入用户名" autocomplete="username" required />
            </div>
            <div class="field">
                <label for="password"><i class="fas fa-lock"></i> 密码</label>
                <input type="password" id="password" placeholder="输入密码" autocomplete="current-password" required />
            </div>
            <div class="login-error" id="loginError"></div>
            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> 登录
            </button>
        </form>

        <div class="login-footer">
            <span>Nexabox</span>
            <span class="status"><i class="fas fa-shield-alt"></i> 加密连接</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. URL 参数解析
            // ============================================================
            const urlParams = new URLSearchParams(window.location.search);
            const targetApp = urlParams.get('app');
            const redirectUrl = urlParams.get('redirect');

            // ============================================================
            //  2. DOM 引用
            // ============================================================
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            // ============================================================
            //  3. Token 工具函数
            // ============================================================
            function getToken() {
                return localStorage.getItem('nexabox_token') ||
                       localStorage.getItem('studio_auth_token') ||
                       sessionStorage.getItem('nexabox_token') ||
                       sessionStorage.getItem('studio_auth_token') ||
                       '';
            }

            function setToken(token, username, permissions) {
                localStorage.setItem('nexabox_token', token);
                localStorage.setItem('nexabox_username', username);
                localStorage.setItem('studio_auth_token', token);
                localStorage.setItem('studio_username', username);
                localStorage.setItem('studio_perms', JSON.stringify(permissions || []));
            }

            function clearToken() {
                localStorage.removeItem('nexabox_token');
                localStorage.removeItem('nexabox_username');
                localStorage.removeItem('studio_auth_token');
                localStorage.removeItem('studio_username');
                localStorage.removeItem('studio_perms');
                sessionStorage.removeItem('nexabox_token');
                sessionStorage.removeItem('studio_auth_token');
            }

            // ============================================================
            //  4. 登录后跳转处理（统一入口）
            // ============================================================
            function handlePostLogin(token, username, permissions, isInitial) {
                // 保存 token
                setToken(token, username, permissions);

                // 判断是否在 iframe 中（工作台模式）
                if (window.parent !== window) {
                    // 在 iframe 中，通过 postMessage 通知父页面
                    window.parent.postMessage({
                        type: 'NEXABOX_LOGIN_SUCCESS',
                        payload: { token, username, permissions, isInitial }
                    }, '*');
                    loginBtn.innerHTML = '✅ 登录成功，正在进入...';
                    loginBtn.style.borderColor = '#2ecc71';
                    loginBtn.style.color = '#2ecc71';
                    loginBtn.disabled = true;
                    return;
                }

                // ===== OSS 回调模式（独立窗口，带 app 和 redirect） =====
                if (targetApp && redirectUrl) {
                    // 检查权限
                    const perms = permissions || [];
                    const hasAll = perms.includes('all');
                    if (hasAll || perms.includes(targetApp)) {
                        const url = new URL(redirectUrl, window.location.origin);
                        url.searchParams.set('token', token);
                        window.location.href = url.toString();
                    } else {
                        errorEl.textContent = '✗ 您没有应用 ' + targetApp + ' 的访问权限！';
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> 登录';
                        loginBtn.style.borderColor = '#4a8bf5';
                        loginBtn.style.color = '#4a8bf5';
                        return;
                    }
                    return;
                }

                // ===== 工作台独立窗口模式 =====
                // 检查是否是首次登录
                if (isInitial) {
                    // 首次登录，跳转到账户中心强制修改密码
                    let target = 'Account.html?change_pwd=1';
                    window.location.href = target;
                } else {
                    window.location.href = 'MainMenu.html';
                }
            }

            // ============================================================
            //  5. 页面加载时验证已有 Token（OSS 回调模式）
            // ============================================================
            async function verifyExistingToken() {
                const token = getToken();
                if (!token) return false;

                try {
                    const res = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, app: targetApp })
                    });
                    const data = await res.json();
                    if (data.valid) {
                        // Token 有效，直接处理跳转
                        const perms = data.permissions || [];
                        handlePostLogin(token, data.username, perms, false);
                        return true;
                    } else {
                        clearToken();
                        return false;
                    }
                } catch (e) {
                    console.warn('Token 验证失败:', e);
                    return false;
                }
            }

            // ============================================================
            //  6. 登录逻辑
            // ============================================================
            async function doLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    errorEl.textContent = '⚠ 请输入用户名和密码';
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="login-spinner"></span> 验证中...';
                errorEl.textContent = '';

                try {
                    const response = await fetch('https://accounts.nexabox.de/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, app: targetApp })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || `请求失败 (${response.status})`);
                    }

                    if (data.success === true && data.token) {
                        // 登录成功，统一处理
                        handlePostLogin(
                            data.token,
                            data.username || username,
                            data.permissions || [],
                            data.isInitial || false
                        );
                    } else {
                        throw new Error(data.message || '登录失败，请检查凭证');
                    }

                } catch (err) {
                    errorEl.textContent = '✗ ' + (err.message || '网络错误，请稍后重试');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> 登录';
                    loginBtn.style.borderColor = '#4a8bf5';
                    loginBtn.style.color = '#4a8bf5';
                }
            }

            // ============================================================
            //  7. 事件绑定 & 初始化
            // ============================================================

            // 表单提交
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                doLogin();
            });

            // 回车登录
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doLogin();
                }
            });

            // 从 URL 参数读取预设用户名
            const presetUser = urlParams.get('username');
            if (presetUser) {
                usernameInput.value = presetUser;
            }

            // 自动聚焦
            if (usernameInput.value) {
                passwordInput.focus();
            } else {
                usernameInput.focus();
            }

            // ===== 初始化：验证已有 Token =====
            (function init() {
                // 如果有 token 且是 OSS 回调模式（有 app 和 redirect），尝试自动验证
                if (targetApp && redirectUrl && getToken()) {
                    verifyExistingToken();
                }
                console.log('[Nexabox Login] 已就绪');
                console.log('  targetApp:', targetApp || '(无)');
                console.log('  redirectUrl:', redirectUrl || '(无)');
                console.log('  iframe:', window.parent !== window ? '是' : '否');
            })();

        })();
    </script>

</body>
</html>
