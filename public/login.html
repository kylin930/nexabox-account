<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Nexabox Account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css">
  <style>
    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }
    .login-title {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 24px;
      text-align: center;
      color: #3f51b5;
    }
    .mdui-textfield {
      padding-top: 8px;
      padding-bottom: 8px;
    }
  </style>
</head>
<body class="mdui-theme-primary-indigo mdui-theme-accent-pink">

  <div class="mdui-card login-card mdui-hoverable">
    <div class="login-title">Nexabox Account</div>
    
    <div class="mdui-textfield mdui-textfield-floating-label">
      <label class="mdui-textfield-label">用户名</label>
      <input class="mdui-textfield-input" type="text" id="username" required/>
    </div>

    <div class="mdui-textfield mdui-textfield-floating-label">
      <label class="mdui-textfield-label">密码</label>
      <input class="mdui-textfield-input" type="password" id="password" required/>
    </div>

    <div class="mdui-m-t-2">
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent mdui-btn-block" onclick="doLogin()">登录</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetApp = urlParams.get('app');
    const redirectUrl = urlParams.get('redirect');

    window.onload = async function() {
      const savedToken = localStorage.getItem('studio_auth_token');
      if (savedToken) {
        try {
          const verifyRes = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: savedToken, app: targetApp })
          });
          const verifyData = await verifyRes.json();
          
          if (verifyData.valid) {
            handleFinalRedirect(savedToken, verifyData.permissions);
          } else {
            localStorage.removeItem('studio_auth_token');
          }
        } catch (e) {
          console.error("Token verification failed", e);
        }
      }
    };

    function handleFinalRedirect(token, permissions) {
      if (targetApp && redirectUrl) {
        if (permissions.includes('all') || permissions.includes(targetApp)) {
          const url = new URL(redirectUrl, window.location.origin);
          url.searchParams.set('token', token);
          window.location.href = url.toString();
        } else {
          mdui.alert(`您没有应用 ${targetApp} 的访问权限！`);
        }
      } else {
        window.location.href = '/index.html';
      }
    }

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        mdui.alert('请输入用户名和密码');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, app: targetApp })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('studio_auth_token', data.token);
          localStorage.setItem('studio_username', data.username);
          localStorage.setItem('studio_perms', JSON.stringify(data.permissions));
          
          if (data.isInitial) {
            mdui.alert('检测到您是首次登录，请先修改初始密码。', '安全提示', () => {
              let target = '/index.html?change_pwd=1';
              if (targetApp) target += `&app=${encodeURIComponent(targetApp)}`;
              if (redirectUrl) target += `&redirect=${encodeURIComponent(redirectUrl)}`;
              window.location.href = target;
            });
          } else {
            handleFinalRedirect(data.token, data.permissions);
          }
        } else {
          const text = await res.text();
          mdui.alert(text || '登录失败，请检查账号密码');
        }
      } catch (e) {
        mdui.alert('网络请求失败');
      }
    }

    // 回车登录
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
