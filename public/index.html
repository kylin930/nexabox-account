<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - Nexabox Account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css">
  <style>
    body { background-color: #f5f5f5; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .user-header { display: flex; align-items: center; padding: 24px; }
    .avatar-large { width: 80px; height: 80px; border-radius: 50%; margin-right: 20px; object-fit: cover; }
    .section-title { font-size: 18px; font-weight: 500; margin: 24px 0 16px; color: #3f51b5; display: flex; align-items: center; }
    .section-title i { margin-right: 8px; }
    .mdui-card { margin-bottom: 24px; }
  </style>
</head>
<body class="mdui-theme-primary-indigo mdui-theme-accent-pink mdui-appbar-with-toolbar">

  <div class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <span class="mdui-typo-headline">Nexabox Account</span>
      <div class="mdui-toolbar-spacer"></div>
      <button id="admin-btn" class="mdui-btn mdui-btn-icon mdui-ripple" mdui-tooltip="{content: '管理员后台'}" style="display: none;" onclick="window.location.href='/admin.html'">
        <i class="mdui-icon material-icons">settings_applications</i>
      </button>
      <button class="mdui-btn mdui-btn-icon mdui-ripple" mdui-tooltip="{content: '退出登录'}" onclick="logout()">
        <i class="mdui-icon material-icons">exit_to_app</i>
      </button>
    </div>
  </div>

  <div class="container">
    <div class="mdui-card">
      <div class="user-header">
        <img id="user-avatar" class="avatar-large" alt="头像">
        <div>
          <div class="mdui-typo-headline" id="username-text">加载中...</div>
          <div class="mdui-typo-subheading-opacity" id="user-perms">加载中...</div>
        </div>
      </div>
      <div class="mdui-divider"></div>
      <div class="mdui-card-content">
        <p><strong>上次登录：</strong> <span id="last-login">加载中...</span></p>
      </div>
    </div>

    <div class="section-title"><i class="mdui-icon material-icons">person</i> 账号设置</div>
    <div class="mdui-row">
      <div class="mdui-col-md-6">
        <div class="mdui-card">
          <div class="mdui-card-primary"><div class="mdui-card-primary-title">设置头像</div></div>
          <div class="mdui-card-content">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">头像 URL</label>
              <input class="mdui-textfield-input" type="text" id="new-avatar"/>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="updateAvatar()">更新头像</button>
          </div>
        </div>
      </div>
      <div class="mdui-col-md-6">
        <div class="mdui-card">
          <div class="mdui-card-primary"><div class="mdui-card-primary-title">修改密码</div></div>
          <div class="mdui-card-content">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">新密码</label>
              <input class="mdui-textfield-input" type="password" id="new-password"/>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="updatePassword()">确认修改</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title"><i class="mdui-icon material-icons">message</i> 内部消息</div>
    <div class="mdui-card">
      <div class="mdui-card-content">
        <div class="mdui-row">
          <div class="mdui-col-md-4">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">接收人用户名</label>
              <input class="mdui-textfield-input" type="text" id="msg-to"/>
            </div>
          </div>
          <div class="mdui-col-md-8">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">消息内容</label>
              <textarea class="mdui-textfield-input" id="msg-content"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="mdui-card-actions">
        <button class="mdui-btn mdui-ripple mdui-color-theme" onclick="sendMessage()">发送消息</button>
        <button class="mdui-btn mdui-ripple" onclick="loadMessages()">刷新收件箱</button>
      </div>
      <div class="mdui-divider"></div>
      <ul class="mdui-list" id="inbox-list">
        <!-- 消息列表 -->
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <script>
    const token = localStorage.getItem('studio_auth_token');
    if (!token) window.location.href = '/login.html';

    async function apiFetch(path, options = {}) {
      options.headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
      const res = await fetch(path, options);
      if (res.status === 401) {
        mdui.alert('登录已过期，请重新登录', '提示', () => logout());
      }
      return res;
    }

    async function loadProfile() {
      const res = await apiFetch('/api/me');
      if (res.ok) {
        const user = await res.json();
        document.getElementById('username-text').innerText = user.username;
        
        const avatarImg = document.getElementById('user-avatar');
        if (user.avatar) {
          avatarImg.src = user.avatar;
          document.getElementById('new-avatar').value = user.avatar;
        } else {
          const firstLetter = user.username.charAt(0).toUpperCase();
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="%23dbeafe"/><text x="50%" y="50%" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="%231e3a8a" text-anchor="middle" dy=".35em">${firstLetter}</text></svg>`;
          avatarImg.src = `data:image/svg+xml;utf8,${svg}`;
        }

        const perms = user.permissions || [];
        document.getElementById('user-perms').innerText = perms.length > 0 ? perms.join(', ') : '无特殊权限';
        
        if (user.lastLogin) {
          document.getElementById('last-login').innerText = new Date(user.lastLogin).toLocaleString();
        } else {
          document.getElementById('last-login').innerText = '首次登录';
        }

        if (perms.includes('admin') || perms.includes('all')) {
          document.getElementById('admin-btn').style.display = 'inline-block';
        }
      }
    }

    async function updateAvatar() {
      const avatarUrl = document.getElementById('new-avatar').value.trim();
      const res = await apiFetch('/api/update-avatar', {
        method: 'POST',
        body: JSON.stringify({ avatar: avatarUrl })
      });
      if (res.ok) {
        mdui.snackbar({ message: '头像设置成功' });
        loadProfile();
      } else {
        mdui.alert('头像设置失败');
      }
    }

    async function updatePassword() {
      const newPassword = document.getElementById('new-password').value;
      if (!newPassword) return mdui.alert('密码不能为空');
      const res = await apiFetch('/api/change-password', {
        method: 'POST',
        body: JSON.stringify({ newPassword })
      });
      if (res.ok) {
        mdui.alert('密码修改成功！', '提示', () => {
          const params = new URLSearchParams(window.location.search);
          const targetApp = params.get('app');
          const redirectUrl = params.get('redirect');
          
          if (targetApp && redirectUrl) {
            const perms = JSON.parse(localStorage.getItem('studio_perms') || '[]');
            if (perms.includes('all') || perms.includes(targetApp)) {
              const url = new URL(redirectUrl, window.location.origin);
              url.searchParams.set('token', token);
              window.location.href = url.toString();
              return;
            }
          }
          document.getElementById('new-password').value = '';
        });
      }
    }

    async function sendMessage() {
      const toUser = document.getElementById('msg-to').value.trim();
      const content = document.getElementById('msg-content').value.trim();
      if (!toUser || !content) return mdui.alert('接收人和内容不能为空');

      const res = await apiFetch('/api/messages', {
        method: 'POST',
        body: JSON.stringify({ toUser, content })
      });
      if (res.ok) {
        mdui.snackbar({ message: '发送成功' });
        document.getElementById('msg-content').value = '';
      } else {
        mdui.alert('发送失败，请检查用户名是否正确。');
      }
    }

    async function loadMessages() {
      const res = await apiFetch('/api/messages');
      if (res.ok) {
        const messages = await res.json();
        const list = document.getElementById('inbox-list');
        if (messages.length === 0) {
          list.innerHTML = '<div class="mdui-p-a-2 mdui-text-center mdui-typo-body-1-opacity">暂无消息</div>';
          return;
        }
        list.innerHTML = messages.reverse().map(msg => `
          <li class="mdui-list-item mdui-ripple">
            <div class="mdui-list-item-content">
              <div class="mdui-list-item-title">${msg.from} <small class="mdui-typo-caption-opacity">${new Date(msg.time).toLocaleString()}</small></div>
              <div class="mdui-list-item-text">${msg.content}</div>
            </div>
          </li>
          <li class="mdui-divider-inset mdui-m-y-0"></li>
        `).join('');
      }
    }

    function logout() {
      localStorage.removeItem('studio_auth_token');
      localStorage.removeItem('studio_perms');
      const params = new URLSearchParams(window.location.search);
      const targetApp = params.get('app');
      const redirectUrl = params.get('redirect');
      let target = '/login.html';
      if (targetApp || redirectUrl) {
        target += '?';
        if (targetApp) target += `app=${encodeURIComponent(targetApp)}&`;
        if (redirectUrl) target += `redirect=${encodeURIComponent(redirectUrl)}`;
        if (target.endsWith('&')) target = target.slice(0, -1);
      }
      window.location.href = target;
    }

    // 检查是否需要修改密码（从 URL 参数）
    if (new URLSearchParams(window.location.search).get('change_pwd')) {
      mdui.snackbar({ message: '请在下方修改您的初始密码' });
      document.getElementById('new-password').focus();
    }

    loadProfile();
    loadMessages();
  </script>
</body>
</html>
