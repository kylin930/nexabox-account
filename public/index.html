<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexabox Workstation</title>
    <!--
    <link rel="stylesheet" href="https://unpkg.com/metro-ui@5.0.2/dist/css/metro-all.min.css">
    <script src="https://unpkg.com/metro-ui@5.0.2/dist/js/metro.min.js"></script>
-->
    <!-- 3. 引入 WinBox.js (捆绑版，包含所有样式和图标) -->
    <script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
    <link rel="stylesheet" href="dist/css/themes/modern.min.css">
    <style>
        body {
            background: #1e1e2f;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #ccc;
        }
        .info {
            text-align: center;
        }
    </style>
</head>
<script>
    // ===== 监听来自 Login.html iframe 的登录消息 =====
    window.addEventListener('message', function(event) {
        // 建议在生产环境中校验 event.origin
        // if (event.origin !== 'https://你的域名') return;

        const data = event.data;
        if (data && data.type === 'NEXABOX_LOGIN_SUCCESS') {
            const { token, username, permissions, isInitial } = data.payload;

            console.log('[Nexabox] 登录成功！');
            console.log('  用户名:', username);
            console.log('  Token:', token);
            console.log('  权限:', permissions);

            // ===== 在这里执行你想要的后续操作 =====
            // 例如：
            // 1. 保存 token 到 localStorage
            localStorage.setItem('nexabox_token', token);
            localStorage.setItem('nexabox_username', username);

            // 2. 更新页面上的用户名显示
            const infoEl = document.getElementById('info');
            if (infoEl) {
                infoEl.innerHTML = `
                    <h1>Nexabox Workstation</h1>
                    <h3>Welcome back,<span style="color: #ffcc00; font-weight: bold;">${username}</span></h3>
                    <p style="color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 8px;">
                        Ver:pre-0.0.1
                    </p>
                `;
            }

            // 3. 关闭登录窗口（如果你希望登录后自动关闭）
            // 可以通过 postMessage 通知 iframe 关闭，或直接移除 iframe
            // 这里示例：隐藏登录界面，显示主菜单
            // 但注意你的 index.html 中已经通过 WinBox 加载了 MainMenu.html
            // 所以登录成功后，可以重新加载主菜单或做其他操作

            // 4. 刷新主菜单（如果已打开）
            // 例如重新加载 MainMenu.html 的 WinBox
            // 由于你的 Window_MainMenu 是全局变量，可以操作它
            if (typeof Window_MainMenu !== 'undefined' && Window_MainMenu) {
                // 可以重新加载
                // Window_MainMenu.setUrl('MainMenu.html?token=' + token);
            }

            // 5. 可选：将 token 附加到后续所有请求中
            // 你可以在全局 fetch 拦截器中添加 Authorization 头
            // 在监听 message 的 if (data && data.type === 'NEXABOX_LOGIN_SUCCESS') { ... } 内部
// 添加以下代码：
const loginFrame = document.getElementById('loginFrame');
if (loginFrame) {
    loginFrame.style.display = 'none';  // 或者直接移除 loginFrame.remove()
}
if (typeof Window_MainMenu !== 'undefined' && Window_MainMenu) {
    Window_MainMenu.setUrl('MainMenu.html');
}
        }
    });

    // ===== 兼容方案：从 URL hash 读取登录信息 =====
    // 如果 iframe 通过 hash 传递数据，父页面也可以监听
    window.addEventListener('hashchange', function() {
        const hash = window.location.hash;
        if (hash.startsWith('#login=')) {
            try {
                const json = decodeURIComponent(hash.replace('#login=', ''));
                const payload = JSON.parse(json);
                // 处理 payload...
                console.log('[Hash Login]', payload);
            } catch (_) {}
        }
    });

    // 页面加载时检查是否有 hash 登录信息
    if (window.location.hash.startsWith('#login=')) {
        try {
            const json = decodeURIComponent(window.location.hash.replace('#login=', ''));
            const payload = JSON.parse(json);
            // 触发登录成功逻辑
            window.dispatchEvent(new CustomEvent('nexabox-login', { detail: payload }));
        } catch (_) {}
    }

    console.log('[Nexabox] 已启动，等待登录...');
</script>
<body>
    <iframe
    id="loginFrame"
    src="Login.html"
    style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        z-index: 9999;
        background: #1e1e2f;
    "
></iframe>
    <div id="info">
        <h1>Nexabox workstation</h1>
        <h3>Welcome back,[Todo:此处插入一个用户名]</h3>
    </div>
</body>
<script>
    var Window_MainMenu = new WinBox({
        title:'工作台主面板',
        x: "center",
        width: "80%",
        height: "90%",
        max: false,
        overflow:false,
        class: ["modern", "no-full", "no-close"],
        y: "center",
        url:'MainMenu.html'
    });
</script>
</html>
