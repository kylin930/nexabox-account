<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaboxDashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    button { padding: 8px 16px; cursor: pointer; border: none; border-radius: 4px; }
    input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
    .message { border-bottom: 1px solid #eee; padding: 10px 0; }
    .time { font-size: 0.8em; }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="welcome-text">加载中...</h2>
    <div>
      <button id="admin-btn" style="display: none;" onclick="window.location.href='/admin.html'">进入管理员后台</button>
      <button class="danger" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="card">
    <h3>我的信息</h3>
    <img id="user-avatar" alt="用户头像" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background-color: #dbeafe; display: block; margin-bottom: 15px;">
    
    <p><strong>账号权限：</strong> <span id="user-perms">加载中...</span></p>
    <p><strong>上次登录：</strong> <span id="last-login">加载中...</span></p>
  </div>

  <div class="card">
    <h3>设置头像</h3>
    <input type="text" id="new-avatar" placeholder="输入头像图片 URL (例如: https://...)">
    <button onclick="updateAvatar()">更新头像</button>
  </div>

  <div class="card">
    <h3>修改密码</h3>
    <input type="password" id="new-password" placeholder="输入新密码">
    <button onclick="updatePassword()">确认修改</button>
  </div>

  <div class="card">
    <h3>发送内部消息</h3>
    <input type="text" id="msg-to" placeholder="接收人用户名 (如: zhangsan)">
    <textarea id="msg-content" rows="3" placeholder="写点什么..."></textarea>
    <button onclick="sendMessage()">发送消息</button>
  </div>

  <div class="card">
    <h3>我的收件箱</h3>
    <button onclick="loadMessages()" style="margin-bottom: 10px;">刷新消息</button>
    <div id="inbox"></div>
  </div>

  <script>
    const token = localStorage.getItem('studio_auth_token');
    
    // 1. 检查是否登录
    if (!token) {
      window.location.href = '/login.html';
    }

    // 统一的请求函数，自动带上 Token
    async function apiFetch(path, options = {}) {
      options.headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
      const res = await fetch(path, options);
      if (res.status === 401) {
        alert('登录已过期，请重新登录');
        logout();
      }
      return res;
    }

    // 2. 加载用户基本信息
    async function loadProfile() {
      const res = await apiFetch('/api/me');
      if (res.ok) {
        const user = await res.json();
        document.getElementById('welcome-text').innerText = `你好，${user.username}！`;
        
        // 处理头像显示
        const avatarImg = document.getElementById('user-avatar');
        if (user.avatar) {
          avatarImg.src = user.avatar;
          document.getElementById('new-avatar').value = user.avatar;
        } else {
          // 生成一个带用户首字母的默认 SVG 头像
          const firstLetter = user.username.charAt(0).toUpperCase();
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="%23dbeafe"/><text x="50%" y="50%" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="%231e3a8a" text-anchor="middle" dy=".35em">${firstLetter}</text></svg>`;
          avatarImg.src = `data:image/svg+xml;utf8,${svg}`;
        }

        // 显示权限
        const perms = user.permissions || [];
        document.getElementById('user-perms').innerText = perms.length > 0 ? perms.join(', ') : '无特殊权限';
        
        // 显示上次登录时间
        if (user.lastLogin) {
          const date = new Date(user.lastLogin);
          document.getElementById('last-login').innerText = date.toLocaleString();
        } else {
          document.getElementById('last-login').innerText = '首次登录';
        }

        // 如果是管理员，显示后台入口
        if (perms.includes('admin') || perms.includes('all')) {
          document.getElementById('admin-btn').style.display = 'inline-block';
        }
      }
    }

    // 更新头像函数
    async function updateAvatar() {
      const avatarUrl = document.getElementById('new-avatar').value.trim();
      
      const res = await apiFetch('/api/update-avatar', {
        method: 'POST',
        body: JSON.stringify({ avatar: avatarUrl })
      });
      
      if (res.ok) {
        alert('头像设置成功！');
        loadProfile(); // 刷新页面数据
      } else {
        alert('头像设置失败');
      }
    }

    // 3. 修改密码
    async function updatePassword() {
      const newPassword = document.getElementById('new-password').value;
      if (!newPassword) return alert('密码不能为空');

      const res = await apiFetch('/api/change-password', {
        method: 'POST',
        body: JSON.stringify({ newPassword })
      });
      if (res.ok) {
        alert('密码修改成功！');
        document.getElementById('new-password').value = '';
      }
    }

    // 4. 发送消息
    async function sendMessage() {
      const toUser = document.getElementById('msg-to').value;
      const content = document.getElementById('msg-content').value;
      if (!toUser || !content) return alert('接收人和内容不能为空');

      const res = await apiFetch('/api/messages', {
        method: 'POST',
        body: JSON.stringify({ toUser, content })
      });
      if (res.ok) {
        alert('发送成功！');
        document.getElementById('msg-content').value = '';
      } else {
        alert('发送失败，请检查用户名是否正确。');
      }
    }

    // 5. 加载收件箱
    async function loadMessages() {
      const res = await apiFetch('/api/messages');
      if (res.ok) {
        const messages = await res.json();
        const inbox = document.getElementById('inbox');
        if (messages.length === 0) {
          inbox.innerHTML = '<p>暂无消息</p>';
          return;
        }
        // 倒序排列，最新的在前面
        inbox.innerHTML = messages.reverse().map(msg => `
          <div class="message">
            <strong>来自: ${msg.from}</strong> 
            <span class="time">(${new Date(msg.time).toLocaleString()})</span>
            <p style="margin: 5px 0 0;">${msg.content}</p>
          </div>
        `).join('');
      }
    }

    // 6. 退出登录
    function logout() {
      localStorage.removeItem('studio_auth_token');
      localStorage.removeItem('studio_perms');
      window.location.href = '/login.html';
    }

    // 初始化页面
    loadProfile();
    loadMessages();
  </script>
</body>
</html>
