<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员后台 - Nexabox Account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css">
  <style>
    body { background-color: #f5f5f5; }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .mdui-card { margin-bottom: 24px; }
    .section-title { font-size: 18px; font-weight: 500; margin: 24px 0 16px; color: #3f51b5; display: flex; align-items: center; }
    .section-title i { margin-right: 8px; }
    .batch-textarea { font-family: monospace; }
  </style>
</head>
<body class="mdui-theme-primary-indigo mdui-theme-accent-pink mdui-appbar-with-toolbar">

  <div class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <button class="mdui-btn mdui-btn-icon mdui-ripple" onclick="window.location.href='/index.html'">
        <i class="mdui-icon material-icons">arrow_back</i>
      </button>
      <span class="mdui-typo-headline">管理员后台</span>
      <div class="mdui-toolbar-spacer"></div>
      <button class="mdui-btn mdui-btn-icon mdui-ripple" onclick="logout()">
        <i class="mdui-icon material-icons">exit_to_app</i>
      </button>
    </div>
  </div>

  <div class="container">
    
    <div class="section-title"><i class="mdui-icon material-icons">person_add</i> 用户管理</div>
    <div class="mdui-row">
      <div class="mdui-col-md-6">
        <div class="mdui-card">
          <div class="mdui-card-primary"><div class="mdui-card-primary-title">新增单个用户</div></div>
          <div class="mdui-card-content">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">用户名</label>
              <input class="mdui-textfield-input" type="text" id="new-user-name"/>
            </div>
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">初始密码</label>
              <input class="mdui-textfield-input" type="text" id="new-user-pwd"/>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="createUser()">创建用户</button>
          </div>
        </div>
      </div>
      <div class="mdui-col-md-6">
        <div class="mdui-card mdui-color-red-50">
          <div class="mdui-card-primary"><div class="mdui-card-primary-title mdui-text-color-red">删除用户</div></div>
          <div class="mdui-card-content">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">要删除的用户名</label>
              <input class="mdui-textfield-input" type="text" id="del-user-name"/>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-text-color-red" onclick="deleteUser()">永久删除</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title"><i class="mdui-icon material-icons">security</i> 权限管理</div>
    <div class="mdui-row">
      <div class="mdui-col-md-6">
        <div class="mdui-card">
          <div class="mdui-card-primary"><div class="mdui-card-primary-title">修改单个权限</div></div>
          <div class="mdui-card-content">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">目标用户名</label>
              <input class="mdui-textfield-input" type="text" id="perm-user-name"/>
            </div>
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">权限列表 (英文逗号分隔, 填 all 为所有)</label>
              <input class="mdui-textfield-input" type="text" id="perm-list"/>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="updatePermissions()">更新权限</button>
          </div>
        </div>
      </div>
      <div class="mdui-col-md-6">
        <div class="mdui-card mdui-color-indigo-50">
          <div class="mdui-card-primary"><div class="mdui-card-primary-title mdui-text-color-theme">一键全体赋权</div></div>
          <div class="mdui-card-content">
            <div class="mdui-textfield mdui-textfield-floating-label">
              <label class="mdui-textfield-label">要赋予的权限名称 (例如: all)</label>
              <input class="mdui-textfield-input" type="text" id="grant-all-perm"/>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme" onclick="grantAllUsers()">立即赋权所有账号</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title"><i class="mdui-icon material-icons">group_work</i> 批量操作</div>
    <div class="mdui-row">
      <div class="mdui-col-md-6">
        <div class="mdui-card">
          <div class="mdui-card-primary">
            <div class="mdui-card-primary-title">批量创建用户</div>
            <div class="mdui-card-primary-subtitle">每行：用户名,初始密码</div>
          </div>
          <div class="mdui-card-content">
            <div class="mdui-textfield">
              <textarea class="mdui-textfield-input batch-textarea" id="batch-users-text" rows="5" placeholder="zhangsan,123456&#10;lisi,abcdef"></textarea>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme" id="btn-batch-create" onclick="batchCreateUsers()">开始批量创建</button>
          </div>
        </div>
      </div>
      <div class="mdui-col-md-6">
        <div class="mdui-card">
          <div class="mdui-card-primary">
            <div class="mdui-card-primary-title">批量修改权限</div>
            <div class="mdui-card-primary-subtitle">每行：用户名,权限1,权限2...</div>
          </div>
          <div class="mdui-card-content">
            <div class="mdui-textfield">
              <textarea class="mdui-textfield-input batch-textarea" id="batch-perms-text" rows="5" placeholder="zhangsan,Wiki,all&#10;lisi,DataBoard"></textarea>
            </div>
          </div>
          <div class="mdui-card-actions">
            <button class="mdui-btn mdui-ripple mdui-color-theme" id="btn-batch-perm" onclick="batchUpdatePermissions()">开始批量赋权</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <script>
    const token = localStorage.getItem('studio_auth_token');
    if (!token) window.location.href = '/login.html';

    async function adminFetch(path, options = {}) {
      options.headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
      const res = await fetch(path, options);
      if (res.status === 403) {
        mdui.alert('抱歉，您没有管理员权限！');
        window.location.href = '/index.html';
        throw new Error('Forbidden');
      }
      if (res.status === 401) {
        window.location.href = '/login.html';
      }
      return res;
    }

    async function createUser() {
      const username = document.getElementById('new-user-name').value.trim();
      const initialPassword = document.getElementById('new-user-pwd').value.trim();
      if (!username || !initialPassword) return mdui.alert('用户名和初始密码必填');

      const res = await adminFetch('/api/admin/users', {
        method: 'POST',
        body: JSON.stringify({ username, initialPassword })
      });
      if (res.ok) {
        mdui.alert(`用户 ${username} 创建成功！`);
        document.getElementById('new-user-name').value = '';
        document.getElementById('new-user-pwd').value = '';
      } else {
        mdui.alert('创建失败');
      }
    }

    async function updatePermissions() {
      const username = document.getElementById('perm-user-name').value.trim();
      const permsStr = document.getElementById('perm-list').value.trim();
      if (!username) return mdui.alert('请指定用户名');

      const permissions = permsStr.split(',').map(p => p.trim()).filter(p => p !== '');
      const res = await adminFetch('/api/admin/users/permissions', {
        method: 'PUT',
        body: JSON.stringify({ username, permissions })
      });
      if (res.ok) {
        mdui.snackbar({ message: `用户 ${username} 权限已更新` });
        document.getElementById('perm-user-name').value = '';
        document.getElementById('perm-list').value = '';
      } else {
        mdui.alert('更新失败，可能用户不存在');
      }
    }

    async function grantAllUsers() {
      const permission = document.getElementById('grant-all-perm').value.trim();
      if (!permission) return mdui.alert('请输入要赋予的权限名称');
      
      mdui.confirm(`确定要给【全体账号】赋予权限：${permission} 吗？`, '一键赋权确认', async () => {
        const res = await adminFetch('/api/admin/users/grant-all', {
          method: 'POST',
          body: JSON.stringify({ permission })
        });
        if (res.ok) {
          const data = await res.json();
          mdui.alert(`一键赋权成功！共更新了 ${data.count} 个账号。`);
          document.getElementById('grant-all-perm').value = '';
        } else {
          mdui.alert('赋权操作失败');
        }
      });
    }

    async function deleteUser() {
      const username = document.getElementById('del-user-name').value.trim();
      if (!username) return mdui.alert('请输入用户名');
      mdui.confirm(`警告：确定要永久删除用户 ${username} 吗？此操作无法恢复！`, '删除确认', async () => {
        const res = await adminFetch('/api/admin/users', {
          method: 'DELETE',
          body: JSON.stringify({ username })
        });
        if (res.ok) {
          mdui.snackbar({ message: `用户 ${username} 已被删除` });
          document.getElementById('del-user-name').value = '';
        } else {
          mdui.alert('删除失败');
        }
      });
    }

    async function batchCreateUsers() {
      const text = document.getElementById('batch-users-text').value.trim();
      if (!text) return mdui.alert('请输入需要批量创建的数据');
      
      const btn = document.getElementById('btn-batch-create');
      btn.disabled = true;
      btn.innerText = '执行中...';

      const lines = text.split('\n');
      let successCount = 0;
      let failCount = 0;

      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(',').map(s => s.trim());
        const username = parts[0];
        const initialPassword = parts[1];
        if (!username || !initialPassword) { failCount++; continue; }
        try {
          const res = await adminFetch('/api/admin/users', {
            method: 'POST',
            body: JSON.stringify({ username, initialPassword })
          });
          if (res.ok) successCount++; else failCount++;
        } catch (e) { failCount++; }
      }

      mdui.alert(`批量创建执行完毕！\n成功: ${successCount} 个\n失败: ${failCount} 个`);
      btn.disabled = false;
      btn.innerText = '开始批量创建';
    }

    async function batchUpdatePermissions() {
      const text = document.getElementById('batch-perms-text').value.trim();
      if (!text) return mdui.alert('请输入批量数据');
      
      const btn = document.getElementById('btn-batch-perm');
      btn.disabled = true;
      btn.innerText = '执行中...';

      const lines = text.split('\n');
      let successCount = 0;
      let failCount = 0;

      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(',').map(s => s.trim());
        const username = parts[0];
        const permissions = parts.slice(1).filter(p => p !== '');
        if (!username) { failCount++; continue; }
        try {
          const res = await adminFetch('/api/admin/users/permissions', {
            method: 'PUT',
            body: JSON.stringify({ username, permissions })
          });
          if (res.ok) successCount++; else failCount++;
        } catch (e) { failCount++; }
      }

      mdui.alert(`批量赋权执行完毕！\n成功: ${successCount} 个\n失败: ${failCount} 个`);
      btn.disabled = false;
      btn.innerText = '开始批量赋权';
    }

    function logout() {
      localStorage.removeItem('studio_auth_token');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
