<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>NexaboxAccountAdmin</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; line-height: 1.6; }
    .card { border: 2px padding: 15px; border-radius: 8px; margin-bottom: 20px;}
    input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; font-family: monospace; }
    textarea { resize: vertical; }
    button { padding: 8px 16px; cursor: pointer; border-radius: 4px; }
    .help-text { font-size: 0.85em; margin-top: -10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>NexaboxAccountAdmin</h2>
  <button class="secondary" onclick="window.location.href='/index.html'" style="margin-bottom: 20px;">返回个人中心</button>

  <div class="card">
    <h3>新增单个用户</h3>
    <input type="text" id="new-user-name" placeholder="设置用户名 (如: lisi)">
    <input type="text" id="new-user-pwd" placeholder="设置初始密码 (登录后会强制修改)">
    <button onclick="createUser()">创建用户</button>
  </div>

  <div class="card">
    <h3>修改单个权限</h3>
    <p class="help-text">权限填应用名称，多个用英文逗号分隔。填 <code>all</code> 代表所有权限。</p>
    <input type="text" id="perm-user-name" placeholder="目标用户名">
    <input type="text" id="perm-list" placeholder="输入权限列表 (如: DataBoard,Wiki)">
    <button onclick="updatePermissions()">更新权限</button>
  </div>

  <div class="card batch-card">
    <h3 style="color: #0056b3;">批量创建用户</h3>
    <p class="help-text">每行一个用户，格式：<b>用户名,初始密码</b>（使用英文逗号）</p>
    <textarea id="batch-users-text" rows="4" placeholder="zhangsan,123456&#10;lisi,abcdef&#10;wangwu,888888"></textarea>
    <button class="primary" id="btn-batch-create" onclick="batchCreateUsers()">批量执行创建</button>
  </div>

  <div class="card batch-card">
    <h3 style="color: #0056b3;">批量修改权限</h3>
    <p class="help-text">每行一个用户，格式：<b>用户名,权限1,权限2...</b>（使用英文逗号）</p>
    <textarea id="batch-perms-text" rows="4" placeholder="zhangsan,DataBoard,Wiki&#10;lisi,all&#10;wangwu,Wiki"></textarea>
    <button class="primary" id="btn-batch-perm" onclick="batchUpdatePermissions()">批量执行赋权</button>
  </div>

  <div class="card" style="border-color: #dc3545; background: #fff5f5;">
    <h3 style="color: #dc3545;">删除用户</h3>
    <input type="text" id="del-user-name" placeholder="输入要删除的用户名">
    <button class="danger" onclick="deleteUser()">永久删除该用户</button>
  </div>

  <script>
    const token = localStorage.getItem('studio_auth_token');
    if (!token) window.location.href = '/login.html';

    // 封装的带 Token 的 Fetch
    async function adminFetch(path, options = {}) {
      options.headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
      const res = await fetch(path, options);
      if (res.status === 403) {
        alert('抱歉，您没有管理员权限！');
        window.location.href = '/index.html';
        throw new Error('Forbidden');
      }
      return res;
    }

    // --- 单个操作 ---
    async function createUser() {
      const username = document.getElementById('new-user-name').value.trim();
      const initialPassword = document.getElementById('new-user-pwd').value.trim();
      if (!username || !initialPassword) return alert('用户名和初始密码必填');

      const res = await adminFetch('/api/admin/users', {
        method: 'POST',
        body: JSON.stringify({ username, initialPassword })
      });
      if (res.ok) {
        alert(`用户 ${username} 创建成功！`);
        document.getElementById('new-user-name').value = '';
        document.getElementById('new-user-pwd').value = '';
      } else {
        alert('创建失败，请查看控制台或重试。');
      }
    }

    async function updatePermissions() {
      const username = document.getElementById('perm-user-name').value.trim();
      const permsStr = document.getElementById('perm-list').value.trim();
      if (!username) return alert('请指定用户名');

      const permissions = permsStr.split(',').map(p => p.trim()).filter(p => p !== '');
      const res = await adminFetch('/api/admin/users/permissions', {
        method: 'PUT',
        body: JSON.stringify({ username, permissions })
      });
      if (res.ok) {
        alert(`用户 ${username} 的权限已更新为: [${permissions.join(', ')}]`);
        document.getElementById('perm-user-name').value = '';
        document.getElementById('perm-list').value = '';
      } else {
        alert('更新失败，可能是找不到该用户。');
      }
    }

    async function deleteUser() {
      const username = document.getElementById('del-user-name').value.trim();
      if (!username) return alert('请输入要删除的用户名');
      if (!confirm(`警告：确定要永久删除用户 ${username} 吗？此操作无法恢复！`)) return;

      const res = await adminFetch('/api/admin/users', {
        method: 'DELETE',
        body: JSON.stringify({ username })
      });
      if (res.ok) {
        alert(`用户 ${username} 已被删除。`);
        document.getElementById('del-user-name').value = '';
      } else {
        alert('删除失败。');
      }
    }

    async function batchCreateUsers() {
      const text = document.getElementById('batch-users-text').value.trim();
      if (!text) return alert('请输入需要批量创建的数据');
      
      const btn = document.getElementById('btn-batch-create');
      btn.disabled = true;
      btn.innerText = '执行中...';

      const lines = text.split('\n');
      let successCount = 0;
      let failCount = 0;

      for (const line of lines) {
        if (!line.trim()) continue;
        
        const parts = line.split(',').map(s => s.trim());
        const username = parts[0];
        const initialPassword = parts[1];

        if (!username || !initialPassword) {
           failCount++;
           continue;
        }

        try {
          const res = await adminFetch('/api/admin/users', {
            method: 'POST',
            body: JSON.stringify({ username, initialPassword })
          });
          if (res.ok) successCount++;
          else failCount++;
        } catch (e) {
          failCount++;
        }
      }

      alert(`批量创建执行完毕！\n成功: ${successCount} 个\n失败/跳过格式错误: ${failCount} 个`);
      if(failCount === 0) document.getElementById('batch-users-text').value = '';
      btn.disabled = false;
      btn.innerText = '批量执行创建';
    }

    async function batchUpdatePermissions() {
      const text = document.getElementById('batch-perms-text').value.trim();
      if (!text) return alert('请输入需要批量赋权的数据');
      
      const btn = document.getElementById('btn-batch-perm');
      btn.disabled = true;
      btn.innerText = '执行中...';

      const lines = text.split('\n');
      let successCount = 0;
      let failCount = 0;

      for (const line of lines) {
        if (!line.trim()) continue;
        
        const parts = line.split(',').map(s => s.trim());
        const username = parts[0];
        const permissions = parts.slice(1).filter(p => p !== '');

        if (!username) {
           failCount++;
           continue;
        }

        try {
          const res = await adminFetch('/api/admin/users/permissions', {
            method: 'PUT',
            body: JSON.stringify({ username, permissions })
          });
          if (res.ok) successCount++;
          else failCount++;
        } catch (e) {
          failCount++;
        }
      }

      alert(`批量赋权执行完毕！\n成功: ${successCount} 个\n失败/跳过未找到用户: ${failCount} 个`);
      if(failCount === 0) document.getElementById('batch-perms-text').value = '';
      btn.disabled = false;
      btn.innerText = '批量执行赋权';
    }
  </script>
</body>
</html>
